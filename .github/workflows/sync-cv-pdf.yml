name: One-shot CV PDF sync

on:
  push:
    paths:
      - ".github/workflows/sync-cv-pdf.yml"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint
        run: pip install weasyprint
      - name: Build PDF from printable CV
        run: weasyprint cv.html Hirro-Kuizon-Content-SEO-AI-Ops-CV-2026.pdf
      - name: Commit synchronized PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hirro-Kuizon-Content-SEO-AI-Ops-CV-2026.pdf
          if git diff --cached --quiet; then
            echo "PDF already synchronized"
          else
            git commit -m "Sync downloadable CV PDF"
            git push
          fi
